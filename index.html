<style>
   :root {
    --neon-green: 163 100% 50%;
    --neon-cyan: 195 100% 50%;
    --glass-bg: 220 13% 8% / 0.2;
    --glass-border: 163 100% 50% / 0.2;
    --radius: 1.5rem;
  }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, hsl(220 13% 4%), hsl(220 13% 10%));
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Popup overlay */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1000;
    backdrop-filter: blur(5px);
  }
  .popup-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Popup box like main glass-panel */
  .popup {
    background: hsl(var(--glass-bg));
    border: 1px solid hsl(var(--glass-border));
    backdrop-filter: blur(10px);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    max-width: 500px;
    width: 90%;
    text-align: center;
    position: relative;
    box-shadow: 0 0 25px hsl(var(--neon-green)/0.3);
    transition: transform 0.4s ease, opacity 0.s ease;
    transform: scale(0.8);
    opacity: 0;
  }
  .popup-overlay.active .popup {
    transform: scale(1);
    opacity: 1;
  }

  .neon-text {
    font-family: 'Audiowide', sans-serif;
    font-size: 2.5rem;
    font-weight: 900;
    background: linear-gradient(45deg, #00ffb7, #00bfff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1rem;
    text-shadow: 0 0 10px hsl(var(--neon-green)/0.7);
  }

  .popup p {
    font-family: 'Inter', sans-serif;
    color: #aaa;
    margin-bottom: 2rem;
  }

  .popup .btn {
    display: inline-block;
    background: rgba(57, 255, 20, 0.15);
    border: 1px solid rgba(57, 255, 20, 0.3);
    color: hsl(var(--neon-green));
    padding: 0.75rem 1.5rem;
    border-radius: 1rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .popup .btn:hover {
    background: hsl(var(--neon-green));
    color: #0a0a0a;
    box-shadow: 0 0 15px hsl(var(--neon-green)), 0 0 30px hsl(var(--neon-green));
  }

  .close-btn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: rgba(255, 255, 255, 0.1);
    border: none;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    color: #fff;
    transition: all 0.3s ease;
  }
  .close-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: hsl(var(--neon-green));
    transform: rotate(90deg);
  }

  /* Optional circuit lines animation */
  .circuit-line {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, hsl(var(--neon-green)/0.3), transparent);
    animation: circuit-flow 4s linear infinite;
  }
  @keyframes circuit-flow {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
</style>

  <!-- Popup JS -->
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const overlay = document.getElementById("popup-overlay");
    const closeBtn = document.getElementById("popup-close");

    // Close popup when clicking the cross button
    closeBtn.addEventListener("click", function() {
      overlay.style.display = "none";
    });
  });

  document.addEventListener("DOMContentLoaded", function() {
    if (!localStorage.getItem("popupShown")) {
      document.getElementById("popup-overlay").style.display = "flex";
      localStorage.setItem("popupShown", "true");
    }
  });
</script>
<script>
  class Progress {
  constructor(param = {}) {
    this.timestamp        = null;
    this.duration         = param.duration || Progress.CONST.DURATION;
    this.progress         = 0;
    this.delta            = 0;
    this.isLoop           = !!param.isLoop;

    this.reset();
  }

  static get CONST() {
    return {
      DURATION : 1000
    };
  }

  reset() {
    this.timestamp = null;
  }

  start(now) {
    this.timestamp = now;
  }

  tick(now) {
    if (this.timestamp) {
      this.delta    = now - this.timestamp;
      this.progress = Math.min(this.delta / this.duration, 1);

      if (this.progress >= 1 && this.isLoop) {
        this.start(now);
      }

      return this.progress;
    } else {
      return 0;
    }
  }
}

class Confetti {
  constructor(param) {
    this.parent         = param.elm || document.body;
    this.canvas         = document.createElement("canvas");
    this.ctx            = this.canvas.getContext("2d");
    this.width          = param.width  || this.parent.offsetWidth;
    this.height         = param.height || this.parent.offsetHeight;
    this.length         = param.length || Confetti.CONST.PAPER_LENGTH;
    this.yRange         = param.yRange || this.height * 2;
    this.progress       = new Progress({
      duration : param.duration,
      isLoop   : true   // still loops internally
    });
    this.rotationRange  = typeof param.rotationRange === "number" ? param.rotationRange
                                                                   : 10;
    this.speedRange     = typeof param.speedRange     === "number" ? param.speedRange
                                                                   : 10;
    this.sprites        = [];
    this.reqId          = null;  // store requestAnimationFrame ID

    this.canvas.style.cssText = [
      "display: block",
      "position: absolute",
      "top: 0",
      "left: 0",
      "pointer-events: none"
    ].join(";");

    this.render = this.render.bind(this);

    this.build();

    this.parent.appendChild(this.canvas);
    this.progress.start(performance.now());

    this.reqId = requestAnimationFrame(this.render);

    // Auto stop after given duration
    if (param.stopAfter) {
      setTimeout(() => this.stop(), param.stopAfter);
    }
  }

  static get CONST() {
    return {
        SPRITE_WIDTH  : 9,
        SPRITE_HEIGHT : 16,
        PAPER_LENGTH  : 100,
        DURATION      : 8000,
        ROTATION_RATE : 50,
        COLORS        : [
          "#EF5350","#EC407A","#AB47BC","#7E57C2","#5C6BC0","#42A5F5","#29B6F6",
          "#26C6DA","#26A69A","#66BB6A","#9CCC65","#D4E157","#FFEE58","#FFCA28",
          "#FFA726","#FF7043","#8D6E63","#BDBDBD","#78909C"
        ]
    };
  }

  build() {
    for (let i = 0; i < this.length; ++i) {
      let canvas = document.createElement("canvas"),
          ctx    = canvas.getContext("2d");

      canvas.width  = Confetti.CONST.SPRITE_WIDTH;
      canvas.height = Confetti.CONST.SPRITE_HEIGHT;

      canvas.position = {
        initX : Math.random() * this.width,
        initY : -canvas.height - Math.random() * this.yRange
      };

      canvas.rotation = (this.rotationRange / 2) - Math.random() * this.rotationRange;
      canvas.speed    = (this.speedRange / 2) + Math.random() * (this.speedRange / 2);

      ctx.save();
        ctx.fillStyle = Confetti.CONST.COLORS[(Math.random() * Confetti.CONST.COLORS.length) | 0];
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      this.sprites.push(canvas);
    }
  }

  render(now) {
    let progress = this.progress.tick(now);

    this.canvas.width  = this.width;
    this.canvas.height = this.height;

    for (let i = 0; i < this.length; ++i) {
      this.ctx.save();
        this.ctx.translate(
          this.sprites[i].position.initX + this.sprites[i].rotation * Confetti.CONST.ROTATION_RATE * progress,
          this.sprites[i].position.initY + progress * (this.height + this.yRange)
        );
        this.ctx.rotate(this.sprites[i].rotation);
        this.ctx.drawImage(
          this.sprites[i],
          -Confetti.CONST.SPRITE_WIDTH * Math.abs(Math.sin(progress * Math.PI * 2 * this.sprites[i].speed)) / 2,
          -Confetti.CONST.SPRITE_HEIGHT / 2,
          Confetti.CONST.SPRITE_WIDTH * Math.abs(Math.sin(progress * Math.PI * 2 * this.sprites[i].speed)),
          Confetti.CONST.SPRITE_HEIGHT
        );
      this.ctx.restore();
    }

    this.reqId = requestAnimationFrame(this.render);
  }

  stop() {
    cancelAnimationFrame(this.reqId);
    if (this.canvas.parentNode) {
      this.parent.removeChild(this.canvas);
    }
  }
}

// Example usage
(() => {
  const DURATION = 8000,
        LENGTH   = 120,
        STOP_AFTER = 5000; // 5 seconds

  new Confetti({
    width    : window.innerWidth,
    height   : window.innerHeight,
    length   : LENGTH,
    duration : DURATION,
    stopAfter: STOP_AFTER
  });

  setTimeout(() => {
    new Confetti({
      width    : window.innerWidth,
      height   : window.innerHeight,
      length   : LENGTH,
      duration : DURATION,
      stopAfter: STOP_AFTER
    });
  }, DURATION / 2);
})();
</script>
